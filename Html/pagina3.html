<!DOCTYPE html>
<html lang="en">

    <meta charset="UTF-8">

<body>

        <table width="100%" border="1" cellpadding="10">

    </header>

        <!-- Esse foi o qual tive mais dificuldade
         pelo simples fator de não lembra muito bem os tipos de forms que existem-->

    <main>
        <section>
            <h2>Responda à pesquisa</h2>

            <form>
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required >

                <br><br>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="exemplo@email.com" required >

                <br><br>

                <label for="data">Data de nascimento:</label>
                <input type="date" id="data" name="data" required>

                <br><br>

                <label for="area">Área de tecnologia:</label>
                <input list="areas" id="area" name="area" placeholder="Escolha uma área">

                <datalist id="areas">
                    <option value="Programação">
                    <option value="Inteligência Artificial">
                    <option value="Redes">
                    <option value="Segurança">
                </datalist>

                <br><br>

                <label for="nivel">Quanto você gosta de tecnologia?</label>
                <input type="range" id="nivel" name="nivel" min="0" max="10" value="5">

                <br><br>

                <button type="submit">Enviar</button>
            </form>
        </section>
    </main>

    <footer>
        <p>Projeto acadêmico - Formulário</p>
    </footer>

</body>
</html>
